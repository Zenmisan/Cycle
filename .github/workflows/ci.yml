name: CI & Multi-Platform Builds

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Rust, Flutter, Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config libclang-dev

      - name: Run Rust Core Tests
        run: |
          cd rust
          cargo test --verbose
          cd ..

      - name: Run Go Relay Server Tests
        run: |
          cd relay-server
          go test -v ./...
          cd ..

      - name: Run Flutter Static Analysis & Tests
        run: |
          flutter pub get
          flutter analyze
          flutter test --verbose

  build-android:
    name: Build Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Cross-Compile Rust for Android
        run: |
          export ANDROID_NDK_HOME=$ANDROID_NDK_ROOT
          ./scripts/build_android_rust.sh

      - name: Build Android APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: cycles-android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-macos:
    name: Build macOS Desktop App
    needs: test
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Build macOS Rust dylib
        run: ./scripts/build_macos_rust.sh

      - name: Build macOS App
        run: |
          flutter pub get
          flutter build macos --release

      - name: Package macOS App
        run: |
          cd build/macos/Build/Products/Release
          zip -r Cycles-macOS.zip Cycles.app
          cd -

      - name: Upload macOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cycles-macos-app
          path: build/macos/Build/Products/Release/Cycles-macOS.zip
