name: CI & Multi-Platform Release Builds

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test (Rust, Flutter, Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config libclang-dev

      - name: Run Rust Core Tests
        run: |
          cd rust
          cargo test --verbose
          cd ..

      - name: Run Go Relay Server Tests
        run: |
          cd relay-server
          go test -v ./...
          cd ..

      - name: Run Flutter Static Analysis & Tests
        run: |
          flutter pub get
          flutter analyze
          flutter test --verbose

  build-android:
    name: Build Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cross-Compile Rust for Android
        run: |
          export ANDROID_NDK_HOME=$ANDROID_NDK_ROOT
          ./scripts/build_android_rust.sh

      - name: Build Android APK
        run: |
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk cycles-1.0.0-android.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: cycles-1.0.0-android.apk
          path: cycles-1.0.0-android.apk

  build-linux:
    name: Build Linux Packages (.tar.gz, .deb, .AppImage)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config libclang-dev clang cmake ninja-build libgtk-3-dev wget

      - name: Build Rust Core
        run: |
          cd rust
          cargo build --release
          cd ..

      - name: Build Linux Desktop App
        run: |
          flutter pub get
          flutter build linux --release

      - name: Package Linux .tar.gz and .deb
        run: |
          # 1. Package universal tarball
          tar -czvf cycles-1.0.0-linux.tar.gz -C build/linux/x64/release/bundle .

          # 2. Package Debian / Ubuntu .deb
          mkdir -p deb/DEBIAN deb/usr/bin deb/usr/share/cycles deb/usr/share/applications deb/usr/share/icons/hicolor/scalable/apps
          cp -r build/linux/x64/release/bundle/* deb/usr/share/cycles/
          ln -s /usr/share/cycles/cycles deb/usr/bin/cycles
          cp assets/icon/cycle.svg deb/usr/share/icons/hicolor/scalable/apps/cycles.svg

          cat << 'EOF' > deb/DEBIAN/control
          Package: cycles
          Version: 1.0.0
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Cycles Authors
          Description: Offline-first peer-to-peer proximity task sync app
          EOF

          cat << 'EOF' > deb/usr/share/applications/cycles.desktop
          [Desktop Entry]
          Name=Cycles
          Comment=Offline-first peer-to-peer task sync
          Exec=/usr/bin/cycles
          Icon=cycles
          Terminal=false
          Type=Application
          Categories=Utility;ProjectManagement;
          EOF

          dpkg-deb --build deb cycles-1.0.0-linux.deb

      - name: Package Linux .AppImage
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/lib AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          cp -r build/linux/x64/release/bundle/* AppDir/usr/bin/
          cp assets/icon/cycle.svg AppDir/cycles.svg
          cp assets/icon/cycle.svg AppDir/usr/share/icons/hicolor/scalable/apps/cycles.svg

          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${HERE}/usr/bin/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/cycles" "$@"
          EOF
          chmod +x AppDir/AppRun

          cat << 'EOF' > AppDir/cycles.desktop
          [Desktop Entry]
          Name=Cycles
          Exec=cycles
          Icon=cycles
          Type=Application
          Categories=Utility;ProjectManagement;
          EOF

          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run AppDir cycles-1.0.0-linux.AppImage

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cycles-linux-packages
          path: |
            cycles-1.0.0-linux.tar.gz
            cycles-1.0.0-linux.deb
            cycles-1.0.0-linux.AppImage

  build-windows:
    name: Build Windows Installer (.exe)
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Rust Core
        run: |
          cd rust
          cargo build --release
          cd ..

      - name: Build Windows App
        run: |
          flutter pub get
          flutter build windows --release

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Compile Windows Installer (.exe)
        shell: pwsh
        run: |
          $issContent = @"
          [Setup]
          AppName=Cycles
          AppVersion=1.0.0
          DefaultDirName={autopf}\Cycles
          DefaultGroupName=Cycles
          OutputDir=.
          OutputBaseFilename=cycles-1.0.0-windows
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64

          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\Cycles"; Filename: "{app}\cycles.exe"
          Name: "{autodesktop}\Cycles"; Filename: "{app}\cycles.exe"
          "@
          Set-Content -Path setup.iss -Value $issContent
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: cycles-1.0.0-windows.exe
          path: cycles-1.0.0-windows.exe

  build-macos:
    name: Build macOS Disk Image (.dmg)
    needs: test
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build macOS Rust dylib
        run: ./scripts/build_macos_rust.sh

      - name: Build macOS App
        run: |
          flutter pub get
          flutter build macos --release

      - name: Create macOS Disk Image (.dmg)
        run: |
          hdiutil create -volname "Cycles" \
            -srcfolder build/macos/Build/Products/Release/Cycles.app \
            -ov -format UDZO cycles-1.0.0-macos.dmg

      - name: Upload macOS Disk Image
        uses: actions/upload-artifact@v4
        with:
          name: cycles-1.0.0-macos.dmg
          path: cycles-1.0.0-macos.dmg

  build-ios:
    name: Build iOS Archive (.ipa)
    needs: test
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build iOS App (Unsigned)
        run: |
          flutter pub get
          flutter build ios --release --no-codesign

      - name: Package iOS .ipa
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r cycles-1.0.0-ios-unsigned.ipa Payload

      - name: Upload iOS Package
        uses: actions/upload-artifact@v4
        with:
          name: cycles-1.0.0-ios-unsigned.ipa
          path: cycles-1.0.0-ios-unsigned.ipa
